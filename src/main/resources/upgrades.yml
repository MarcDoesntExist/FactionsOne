# Faction upgrades bought with faction points.
# effect: WARP_LIMIT, TNT_LIMIT, MEMBER_LIMIT, ALLY_LIMIT, CLAIM_LIMIT or POWER_MAX.
# MEMBER_LIMIT, ALLY_LIMIT and CLAIM_LIMIT only apply when the matching base
# limit (factionMemberLimit, factionAllyLimit, claimedLandsMax) is greater than
# zero; zero means no limit. POWER_MAX adds whole points per level to
# powerPlayerMax. The cost is base-cost * (cost-multiplier ^ current-level),
# rounded up.
upgrades:
  warps:
    name: "Warp slots"
    max-level: 3
    base-cost: 5
    cost-multiplier: 2.0
    effect: WARP_LIMIT
    amount-per-level: 1
  tnt:
    name: "TNT bank capacity"
    max-level: 3
    base-cost: 5
    cost-multiplier: 2.0
    effect: TNT_LIMIT
    amount-per-level: 64
