# Faction shop paid with faction points.
# ITEM offers use material/amount; PERK offers use perk and duration-minutes:
#   POWER_BOOST, MONEY, POINTS or TEMP_FLAG (set perk-flag to a flag name).
# material, amount and cost are required; name/lore are optional display text.
offers:
  bread:
    material: BREAD
    amount: 4
    cost: 2
    name: "Bread bundle"
    lore:
      - "Four bread for two faction points."
  iron:
    material: IRON_INGOT
    amount: 8
    cost: 5
    name: "Iron bundle"
    lore:
      - "Eight iron ingots for five faction points."
  power-surge:
    type: PERK
    perk: POWER_BOOST
    perk-amount: 2.0
    duration-minutes: 60
    material: NETHER_STAR
    cost: 10
    name: "Power surge"
    lore:
      - "Two extra faction power for one hour."
