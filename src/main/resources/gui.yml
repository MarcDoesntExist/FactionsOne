# FactionsOne GUI configuration
# Text uses the same tags as the rest of the plugin (<gold>, <aqua>, <gray>, ...).
# Every item supports:
#   serialized: Base64 of ItemStack#serializeAsBytes() -> any vanilla/modded-in-data item
#   material, amount, name, lore, enchants, flags, custom-model-data, item-model,
#   unbreakable, glint, hide-tooltip, rarity
# A player head can use head.name, head.uuid, head.texture (base64 or URL) and
# head.signature. Raw serialized items are the complete fallback for components,
# books, banners, potions, armor trims and any other item type.
menu:
  main:
    title: "<gold>Factions"
    rows: 5
    slots:
      info: 4
      members: 10
      perms: 11
      relations: 12
      territory: 13
      bank: 14
      warps: 15
      upgrades: 16
      missions: 19
      shop: 20
      logs: 21
      close: 22
  info:
    title: "<gold>Faction info"
    rows: 3
    name: "<gold>%s"
    lore:
      - "<gray>Description: <white>%s"
      - "<gray>Members: <white>%s"
      - "<gray>Online: <white>%s"
      - "<gray>Power: <white>%s"
      - "<gray>Claims: <white>%s"
      - "<gray>Bank: <white>%s"
  members:
    title: "<aqua>Members"
    rows: 6
    entry-name: "<white>%s"
    entry-lore:
      - "<gray>Role: <white>%s"
      - "<gray>Power: <white>%s"
      - "<gray>Status: <white>%s"
      - "<yellow>Click for actions"
  member-actions:
    title: "<aqua>Member actions"
    rows: 3
    denied: "<red>You cannot do that."
  perms:
    title: "<gold>Permissions"
    rows: 6
    entry-name: "<aqua>%s"
    entry-lore:
      - "<yellow>Click to edit this permission"
  perm-editor:
    title: "<gold>Permissions: <white>%s"
    rows: 3
    role-name: "<white>%s"
    role-lore:
      - "<gray>Click to toggle: <white>%s"
  relations:
    title: "<aqua>Relations"
    rows: 3
  territory:
    title: "<aqua>Territory"
    rows: 3
  bank:
    title: "<gold>Bank"
    rows: 3
  warps:
    title: "<aqua>Warps"
    rows: 6
  upgrades:
    title: "<gold>Upgrades"
    rows: 6
  missions:
    title: "<aqua>Missions"
    rows: 6
  shop:
    title: "<gold>Shop"
    rows: 6
  top:
    title: "<gold>Top factions"
    rows: 6
    entry-name: "<gold>#%s <white>%s"
    entry-lore:
      - "<gray>%s: <white>%s"
  logs:
    title: "<gray>Faction logs"
    rows: 6

