name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build and test (Java 25)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '25'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: ~/.gradle/caches
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Grant execute permission
        run: chmod +x gradlew

      # Compiles, runs the unit suite (including PluginYamlContractTest) and
      # packages the jar. A failure in any of those fails the job.
      - name: Build, test and package
        run: ./gradlew clean build --no-daemon --console=plain

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: build/reports/tests/test
          retention-days: 7

      - name: Upload plugin jar
        uses: actions/upload-artifact@v4
        with:
          name: factionsone
          path: build/libs/factionsone-*.jar
          if-no-files-found: error
          retention-days: 7

  # Boots the jar on a real Paper server and dispatches every command root.
  # Requires a Paper 26.3 jar: CI downloads the current build, locally the task
  # falls back to test-server/paper-26.3-259.jar.
  smoke:
    name: Paper boot smoke test
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '25'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: ~/.gradle/caches
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Download Paper 26.3
        run: |
          set -euo pipefail
          mkdir -p test-server
          # Fill is PaperMC's current API; builds are listed newest first.
          url=$(curl -fsSL -A "FactionsOne-CI" \
            "https://fill.papermc.io/v3/projects/paper/versions/26.3/builds" \
            | python3 -c "import sys,json; print(json.load(sys.stdin)[0]['downloads']['server:default']['url'])")
          curl -fsSL -o test-server/paper-26.3.jar "$url"
          echo "PAPER_SERVER_JAR=$(pwd)/test-server/paper-26.3.jar" >> "$GITHUB_ENV"

      - name: Grant execute permission
        run: chmod +x gradlew

      - name: Run the smoke test
        run: ./gradlew smokeTest --no-daemon --console=plain

      - name: Upload smoke log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-log
          path: build/smoke/smoke.log
          if-no-files-found: ignore
          retention-days: 7
